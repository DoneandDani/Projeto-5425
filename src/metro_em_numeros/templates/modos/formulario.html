
{% extends "base.html" %}
{% block conteudo %}
<h2>{{ titulo }}</h2>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" action="{{ acao }}">
  <div>
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" maxlength="100" value="{{ nome }}" required>
  </div>
  <div>
    <label for="descricao">Descrição (opcional)</label>
    <input id="descricao" name="descricao" type="text" maxlength="255" value="{{ descricao }}">
  </div>
  <button type="submit">Guardar</button>
  <a href="/modos">Cancelar</a>
</form>
{% endblock %}
