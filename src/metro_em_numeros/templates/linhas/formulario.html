
{% extends "base.html" %}
{% block conteudo %}
<h2>{{ titulo }}</h2>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" action="{{ acao }}">
  <div>
    <label for="codigo">Código{% if editar %} (não pode ser alterado){% endif %}</label>
    <input id="codigo" name="codigo" type="text" maxlength="20" value="{{ codigo }}"
           required{% if editar %} readonly{% endif %}>
  </div>
  <div>
    <label for="nome">Nome</label>
    <input id="nome" name="nome" type="text" maxlength="100" value="{{ nome }}" required>
  </div>
  <div>
    <label for="id_modo">Modo de transporte</label>
    <select id="id_modo" name="id_modo" required>
      <option value="">Escolha…</option>
      {% for m in modos %}
      <option value="{{ m.id }}"{% if m.id|string == id_modo|string %} selected{% endif %}>{{ m.nome }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit">Guardar</button>
  <a href="/linhas">Cancelar</a>
</form>
{% endblock %}
