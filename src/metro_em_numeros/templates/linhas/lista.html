
{% extends "base.html" %}
{% block conteudo %}
<h2>Linhas</h2>
{% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
<p><a href="/linhas/novo">Registar linha</a></p>
<table>
  <thead>
    <tr><th>Código</th><th>Nome</th><th>Modo</th><th>Ações</th></tr>
  </thead>
  <tbody>
    {% for linha in linhas %}
    <tr>
      <td>{{ linha.codigo }}</td>
      <td>{{ linha.nome }}</td>
      <td>{{ nomes_modos[linha.id_modo] }}</td>
      <td>
        <a href="/linhas/{{ linha.id }}/editar">Editar</a>
        <form method="post" action="/linhas/{{ linha.id }}/eliminar" class="inline"
              onsubmit="return confirm('Eliminar esta linha?');">
          <button type="submit">Eliminar</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4">Ainda não existem linhas.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
