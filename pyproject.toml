
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-em-numeros"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metro_em_numeros = [
    "templates/*.html",
    "templates/indicadores/*.html",
    "static/css/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]